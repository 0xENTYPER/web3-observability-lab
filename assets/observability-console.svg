<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Web3 observability console reference report</title>
  <desc id="desc">A reference dashboard showing provider availability, latency, valuation drift, data quality, and cache telemetry.</desc>
  <rect width="1400" height="760" fill="#0B0F16"/>
  <rect x="28" y="28" width="1344" height="704" rx="8" fill="#111722" stroke="#2B3545" stroke-width="2"/>

  <text x="68" y="82" fill="#F7F9FC" font-family="Arial, sans-serif" font-size="28" font-weight="700">WEB3 OBSERVABILITY LAB</text>
  <text x="68" y="112" fill="#8F9AAD" font-family="Arial, sans-serif" font-size="14">REFERENCE FIXTURE · BASE / USDC · 3 PROVIDERS · 9 OBSERVATIONS</text>
  <rect x="1156" y="62" width="166" height="34" rx="4" fill="#17291F" stroke="#35D07F"/>
  <text x="1239" y="84" fill="#35D07F" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EVIDENCE VISIBLE</text>
  <line x1="68" y1="138" x2="1332" y2="138" stroke="#2B3545"/>

  <g font-family="Arial, sans-serif">
    <rect x="68" y="170" width="292" height="126" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="90" y="201" fill="#8F9AAD" font-size="13" font-weight="700">PROVIDER AVAILABILITY</text>
    <text x="90" y="248" fill="#FFCA5C" font-size="34" font-weight="700">66.7–100%</text>
    <text x="90" y="276" fill="#C4CBD6" font-size="13">Worst provider fails the 99% SLO</text>

    <rect x="378" y="170" width="292" height="126" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="400" y="201" fill="#8F9AAD" font-size="13" font-weight="700">P95 LATENCY</text>
    <text x="400" y="248" fill="#FF6B6B" font-size="34" font-weight="700">900 ms</text>
    <text x="400" y="276" fill="#C4CBD6" font-size="13">Worst successful provider path</text>

    <rect x="688" y="170" width="292" height="126" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="710" y="201" fill="#8F9AAD" font-size="13" font-weight="700">MCAP DRIFT</text>
    <text x="710" y="248" fill="#FF6B6B" font-size="34" font-weight="700">40.0%</text>
    <text x="710" y="276" fill="#C4CBD6" font-size="13">MCAP and FDV never mixed</text>

    <rect x="998" y="170" width="334" height="126" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="1020" y="201" fill="#8F9AAD" font-size="13" font-weight="700">CACHE TELEMETRY</text>
    <text x="1020" y="248" fill="#35D07F" font-size="34" font-weight="700">66.7% hit</text>
    <text x="1020" y="276" fill="#C4CBD6" font-size="13">Fresh 1 · stale 1 · miss 1</text>

    <rect x="68" y="326" width="744" height="354" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="92" y="360" fill="#F7F9FC" font-size="16" font-weight="700">Provider health</text>
    <text x="92" y="386" fill="#8F9AAD" font-size="12">Availability and latency are separate signals</text>

    <text x="92" y="432" fill="#C4CBD6" font-size="13">dex-screener</text>
    <rect x="234" y="416" width="440" height="20" rx="3" fill="#232D3B"/>
    <rect x="234" y="416" width="440" height="20" rx="3" fill="#35D07F"/>
    <text x="700" y="431" fill="#F7F9FC" font-size="13" text-anchor="end">100% · p95 900 ms</text>

    <text x="92" y="488" fill="#C4CBD6" font-size="13">gecko-terminal</text>
    <rect x="234" y="472" width="440" height="20" rx="3" fill="#232D3B"/>
    <rect x="234" y="472" width="293" height="20" rx="3" fill="#FFCA5C"/>
    <text x="700" y="487" fill="#F7F9FC" font-size="13" text-anchor="end">66.7% · p95 700 ms</text>

    <text x="92" y="544" fill="#C4CBD6" font-size="13">pnlflex-gateway</text>
    <rect x="234" y="528" width="440" height="20" rx="3" fill="#232D3B"/>
    <rect x="234" y="528" width="440" height="20" rx="3" fill="#35D07F"/>
    <text x="700" y="543" fill="#F7F9FC" font-size="13" text-anchor="end">100% · p95 95 ms</text>

    <line x1="92" y1="584" x2="788" y2="584" stroke="#2B3545"/>
    <text x="92" y="618" fill="#8F9AAD" font-size="12" font-weight="700">QUALITY MIX</text>
    <rect x="92" y="636" width="170" height="14" rx="3" fill="#35D07F"/>
    <rect x="262" y="636" width="410" height="14" fill="#62A8FF"/>
    <rect x="672" y="636" width="116" height="14" rx="3" fill="#FFCA5C"/>
    <text x="92" y="670" fill="#C4CBD6" font-size="12">validated 2</text>
    <text x="280" y="670" fill="#C4CBD6" font-size="12">partial 5</text>
    <text x="684" y="670" fill="#C4CBD6" font-size="12">degraded 1</text>

    <rect x="838" y="326" width="494" height="354" rx="6" fill="#151D29" stroke="#2B3545"/>
    <text x="862" y="360" fill="#F7F9FC" font-size="16" font-weight="700">SLO evidence</text>
    <text x="862" y="386" fill="#8F9AAD" font-size="12">Missing evidence fails closed</text>

    <circle cx="879" cy="430" r="7" fill="#FF6B6B"/>
    <text x="900" y="435" fill="#F7F9FC" font-size="14">Availability ≥ 99%</text>
    <text x="1300" y="435" fill="#FF6B6B" font-size="13" text-anchor="end">FAIL</text>
    <line x1="862" y1="458" x2="1308" y2="458" stroke="#2B3545"/>

    <circle cx="879" cy="490" r="7" fill="#FF6B6B"/>
    <text x="900" y="495" fill="#F7F9FC" font-size="14">P95 latency ≤ 800 ms</text>
    <text x="1300" y="495" fill="#FF6B6B" font-size="13" text-anchor="end">FAIL</text>
    <line x1="862" y1="518" x2="1308" y2="518" stroke="#2B3545"/>

    <circle cx="879" cy="550" r="7" fill="#FF6B6B"/>
    <text x="900" y="555" fill="#F7F9FC" font-size="14">Valuation spread ≤ 10%</text>
    <text x="1300" y="555" fill="#FF6B6B" font-size="13" text-anchor="end">FAIL</text>
    <line x1="862" y1="578" x2="1308" y2="578" stroke="#2B3545"/>

    <circle cx="879" cy="610" r="7" fill="#FF6B6B"/>
    <text x="900" y="615" fill="#F7F9FC" font-size="14">Stale cache rate ≤ 20%</text>
    <text x="1300" y="615" fill="#FF6B6B" font-size="13" text-anchor="end">FAIL</text>
    <text x="862" y="658" fill="#8F9AAD" font-size="12">A red report is useful when it explains exactly why.</text>
  </g>
</svg>
